    <script>
const menuBtn = document.getElementById("menuBtn");
const menu = document.getElementById("emulatorMenu");

menuBtn.onclick = () => {
  menu.classList.toggle("open");
};

const p1Controls = document.querySelector(".moveLists");
const p2Controls = document.querySelector(".moveListsP2");
const controlPanel = document.querySelector(".onscreen-controls-panel");
const joystick = document.getElementById("joystick");

let activeTab = null;
let settingsOpen = false;

// Toggle side menu
menuBtn.onclick = (e) => {
  e.stopPropagation(); 
  menu.classList.toggle("open");
};

// Tab buttons
document.querySelectorAll(".tabBtn").forEach(btn => {
  btn.onclick = (e) => {
    e.stopPropagation(); 
    const tab = btn.dataset.tab;

    if (tab === "settings") {
      settingsOpen = !settingsOpen;
      if (settingsOpen) controlPanel.classList.add("show");
      else controlPanel.classList.remove("show");
      return;
    }

    if (activeTab === tab) {
      p1Controls.style.display = "none";
      p2Controls.style.display = "none";
      joystick.style.display = "none";
      activeTab = null;
      return;
    }

    activeTab = tab;

    p1Controls.style.display = "none";
    p2Controls.style.display = "none";
    joystick.style.display = "none";

    if (tab === "p1") {
      p1Controls.style.display = "flex";
      joystick.style.display = "block";
    }

    if (tab === "p2") {
      p2Controls.style.display = "flex";
    }
  };
});


document.addEventListener("click", (e) => {

  if (!menu.contains(e.target) && !menuBtn.contains(e.target)) {
    menu.classList.remove("open");
  }

  if (!controlPanel.contains(e.target)) {
    controlPanel.classList.remove("show");
    settingsOpen = false;
  }
});

document.getElementById('editLayoutBtn').addEventListener('click', () => {
  if (!layoutEditMode) {
    enableLayoutEdit();
   
  } else {
    disableLayoutEdit();
   
  }
});

document.getElementById('joystickAlign').addEventListener('change', e => {
    const val = e.target.value;
    const joystick = document.getElementById('joystick');

    switch(val){
        case 'bottom-left': joystick.style.left='15vw'; joystick.style.top='75vh'; break;
        case 'bottom-right': joystick.style.left='80vw'; joystick.style.top='75vh'; break;
        case 'top-left': joystick.style.left='15vw'; joystick.style.top='15vh'; break;
        case 'top-right': joystick.style.left='80vw'; joystick.style.top='15vh'; break;
    }

    saveControlPosition('joystick');
});
</script>
